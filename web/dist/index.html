<html lang="en" data-theme="light">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fb" />
    <link rel="icon" type="image/svg+xml" href="/agent_shell_logo.svg" />

    <link rel="apple-touch-icon" href="/agent_shell_logo-180.png" />
    <title>AgentShell</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('agentshell.theme')
        const theme = savedTheme === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        const color = document.querySelector('meta[name="theme-color"]')
        if (color) color.setAttribute('content', theme === 'dark' ? '#090a09' : '#f6f8fb')
      } catch (_) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
